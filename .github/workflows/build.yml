
name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: ARM64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      BUILD_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build tools
        shell: pwsh
        run: |
          dotnet build tools\Nebula.Embed.Cli\Nebula.Embed.Cli.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Embed CLI build failed." }

          dotnet build tools\Nebula.Import\Nebula.Import.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Import build failed." }

      - name: Restore app
        shell: pwsh
        run: |
          dotnet restore src\Nebula.Windows\Nebula.Windows.csproj -p:Platform=$env:BUILD_PLATFORM -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw "Restore failed." }

      - name: Build renderer
        shell: pwsh
        run: |
          .\src\Nebula.Render\build.ps1 -Architecture $env:BUILD_PLATFORM -Configuration Release -BuildTestsOnly
          if ($LASTEXITCODE -ne 0) { throw "Renderer build failed." }

      - name: Build app
        shell: pwsh
        run: |
          dotnet build src\Nebula.Windows\Nebula.Windows.csproj -p:Platform=$env:BUILD_PLATFORM -c Release --no-restore -p:NebulaSkipNativeBuild=true
          if ($LASTEXITCODE -ne 0) { throw "App build failed." }

      - name: Core checks
        shell: pwsh
        run: |
          dotnet run -c Release --project tests\Nebula.Core.Tests
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed." }

      - name: Engine verification
        shell: pwsh
        run: |
          dotnet run -c Release --project tools\Nebula.Embed.Cli -- --bench --stage verify --sizes 2 --out "$env:RUNNER_TEMP\bench"
          if ($LASTEXITCODE -ne 0) { throw "Engine verification failed." }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set MSIX version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          $manifestPath = "src\Nebula.Windows\Package.appxmanifest"

          [xml]$manifest = Get-Content $manifestPath -Raw
          $identity = $manifest.SelectSingleNode("//*[local-name()='Identity']")

          if ($null -eq $identity) {
            throw "Package Identity not found."
          }

          if ($env:GITHUB_REF -match '^refs/tags/v') {
            if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?$') {
              throw "Invalid release tag: $env:RELEASE_TAG"
            }

            $version = $Matches['version'] + '.0'
            $identity.SetAttribute("Version", $version)

            Write-Host "MSIX version: $version"
          }
          else {
            Write-Host "Using manifest version: $($identity.GetAttribute('Version'))"
          }

          $manifest.Save((Resolve-Path $manifestPath).Path)

      - name: Build and package MSIX
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "packages\$env:BUILD_PLATFORM"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $packageDir = $packageDir.TrimEnd('\') + '\'

          msbuild src\Nebula.Windows\Nebula.Windows.csproj `
            -restore `
            -t:Build `
            -p:Configuration=Release `
            -p:Platform=$env:BUILD_PLATFORM `
            -p:NebulaSkipNativeBuild=true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:PublishTrimmed=false `
            "-p:AppxPackageDir=$packageDir"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX packaging failed."
          }

          $packages = @(
            Get-ChildItem -Path $packageDir -Filter *.msix -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' }
          )

          if ($packages.Count -ne 1) {
            $packages | ForEach-Object { Write-Host $_.FullName }
            throw "Expected exactly one main MSIX package, found $($packages.Count)."
          }

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $destination = Join-Path $releaseDir "Nebula-$env:BUILD_PLATFORM.msix"
          Copy-Item $packages[0].FullName $destination -Force

          Write-Host "Created: $destination"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-msix-${{ matrix.platform }}
          path: release/Nebula-${{ matrix.platform }}.msix
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Prepare release metadata
        id: meta
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
            NAME="Nebula $REF_NAME"

            if [[ "$REF_NAME" == *-* ]]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          else
            TAG="ci-build-$RUN_NUMBER"
            NAME="Nebula CI Build #$RUN_NUMBER"
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download MSIX packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release/**/*.msix
